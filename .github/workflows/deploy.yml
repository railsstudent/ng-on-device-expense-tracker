name: Deploy to GitHub Pages
    on:
      push:
        branches:
          - main
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    jobs:
      deploy:
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Setup Node.js (v24.x)
            uses: actions/setup-node@v4
            with:
              node-version: '24'
              cache: 'npm'

          - name: Install Dependencies
            run: npm ci

          - name: Build Application
            run: npx ng build --configuration production --base-href /ng-on-device-
  expense-tracker/
          - name: Create 404 Routing Fallback
            run: cp dist/ng-on-device-expense-tracker/browser/index.html dist/ng-on-
  device-expense-tracker/browser/404.html

          - name: Upload Static Pages Artifact
            uses: actions/upload-pages-artifact@v3
            with:
              path: dist/ng-on-device-expense-tracker/browser

          - name: Deploy to GitHub Pages
            id: deployment
            uses: actions/deploy-pages@v4
