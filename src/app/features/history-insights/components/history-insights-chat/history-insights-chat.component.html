<header class="chat-header">
  <h2 class="chat-title">Intelligence / 智慧分析</h2>

  <!-- Unified Local WebGPU Model Load Status Indicators (Sub-component) -->
  <app-history-insights-status [status]="state().status" [error]="state().error"></app-history-insights-status>
</header>

<!-- Prompt Input Container -->
<form (submit)="onSubmit($event)" class="chat-prompt-box">
  <textarea
    [formField]="chatForm.query"
    placeholder="Ask Gemma about your current ledger (e.g., 'What is my highest category expense?' or 'Show dining trends'...)"
    class="chat-textarea"
  ></textarea>

  <button type="submit" [disabled]="isSubmitDisabled()" class="chat-ask-button">
    <span class="material-symbols-outlined text-sm">auto_awesome</span>
    <span>Ask Gemma</span>
  </button>
</form>

<!-- Safe Client-Side Guardrail Warning Overlay -->
@if (isQueryUnsafe()) {
  <div class="chat-guardrail">
    <span class="material-symbols-outlined chat-guardrail-icon">gavel</span>
    <div class="flex flex-col">
      <h4 class="chat-guardrail-title">Prompt Rejected / 安全防護攔截</h4>
      <p class="chat-guardrail-desc">
        Please ask a relevant financial question about your expense ledger. Off-topic, toxic, or gibberish prompts are
        ignored to save computing power.
      </p>
    </div>
  </div>
}

<!-- Streaming Insight Cards Display Grid (Sub-component) -->
<app-history-insights-list
  [insights]="state().streamingInsights"
  [status]="state().status"
  [showWelcomeBox]="showWelcomeBox()"
  [isQueryUnsafe]="isQueryUnsafe()"
></app-history-insights-list>
