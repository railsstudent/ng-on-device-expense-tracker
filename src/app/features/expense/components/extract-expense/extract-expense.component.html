<div class="app-page-shell">
  <div class="split-layout-grid">
    <!-- Left Area (Image Zone - 5 Columns) -->
    <div class="left-panel">
      <!-- On-Device AI Cache Downloader -->
      <app-model-downloader />

      <!-- Standalone Image Uploader Widget -->
      <app-image-uploader (imageSelected)="onImageSelected($event)" />
    </div>

    <!-- Right Area (Form Zone - 7 Columns) -->
    <div class="right-panel">
      <!-- Human-in-the-Loop Validation Form -->
      <app-review-form
        [initialData]="extractedExpense()"
        [isSaving]="isSaving()"
        (saved)="onFormSaved($event)"
        (cleared)="onFormCleared()"
      />
    </div>
  </div>
</div>
