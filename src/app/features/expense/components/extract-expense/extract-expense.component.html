<div class="extract-expense-shell">
  <div class="split-layout-grid">
    <!-- Left Area (Image Zone - 5 Columns) -->
    <div class="left-panel">
      <!-- On-Device AI Cache Downloader -->
      <app-model-downloader></app-model-downloader>

      <!-- Standalone Image Uploader Widget -->
      <app-image-uploader (imageSelected)="onImageSelected($event)"></app-image-uploader>

      <!-- Manual AI Scan Action Button -->
      <button class="ocr-trigger-button" [disabled]="!selectedImageBase64() || isProcessing()" (click)="triggerLocalOcr()">
        <span class="material-symbols-outlined" [class.rotating]="isProcessing()">analytics</span>
        {{ isProcessing() ? 'EXTRACTING WITH AI...' : 'Extract Expense with AI' }}
      </button>

      @if (isProcessing()) {
        <div class="ocr-status-text">
          {{ statusText() }}
        </div>
      }
    </div>

    <!-- Right Area (Form Zone - 7 Columns) -->
    <div class="right-panel">
      <!-- Human-in-the-Loop Validation Form -->
      <app-review-form
        [(merchantName)]="merchantName"
        [(amount)]="amount"
        [(transactionDate)]="transactionDate"
        [(category)]="selectedCategory"
        [(isReceipt)]="isReceipt"
        [(hasExtracted)]="hasExtracted"
        (saved)="onFormSaved($event)"
      ></app-review-form>
    </div>
  </div>
</div>
